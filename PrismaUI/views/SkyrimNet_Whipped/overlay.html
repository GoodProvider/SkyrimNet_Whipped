<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SkyrimNet Whipped Overlay</title>
    <!--
        Whipping overlay (C++ Overlay.cpp). Shown without Focus: no cursor, no input, game keeps running.
        C++ pushes whipUpdate({actors:[{id, name, parts:[[damage, healing] x6]}]}) whenever the engine state
        changes; parts are head, body, right arm, left arm, right leg, left leg. Damage 0..20, healing 0..11
        (11 = healed). whipReset() drops everything (new game / load / overlay turned off).
        One bar per tracked, not fully healed actor, most recently hit first. Hurting: width = total damage
        over the whole body (6 x 20), colored by the average damage of the damaged parts. Healing (no damage
        left): width = healing progress of the parts still healing, colored by their average healing.
        The whole overlay fades IDLE_MS after the last change and comes back, with every bar, on the next one.
        Actors missing from the push are fully healed (or dead / unloaded): their bar empties and fades.
    -->
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :root {
            --text-primary: #e8e6e1;
            --font-ui: 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', system-ui, sans-serif;
            --bar-width: 220px;
            --bar-height: 34px;
            --light: #e8837a;
            --medium: #d0342c;
            --severe: #7a0c0c;
            --recovering: #f2c94c;
            --mostly-healed: #f7e08a;
        }
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            width: 100%;
            height: 100%;
            user-select: none;
            pointer-events: none;
            font-family: var(--font-ui);
            color: var(--text-primary);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9), 0 0 4px rgba(0, 0, 0, 0.8);
        }
        #overlay {
            position: absolute;
            top: 12%;
            right: 3%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        #overlay.shown { opacity: 1; }
        .bar {
            position: relative;
            width: var(--bar-width);
            height: var(--bar-height);
            border-radius: 3px;
            background: rgba(0, 0, 0, 0.45);
            box-shadow: 0 0 0 1px rgba(201, 168, 76, 0.35);
            overflow: hidden;
            transition: opacity 0.6s ease;
        }
        .bar.fading { opacity: 0; }
        .fill {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0;
            transition: width 0.4s ease, background-color 0.4s linear;
        }
        .fill.light { background-color: var(--light); }
        .fill.medium { background-color: var(--medium); }
        .fill.severe { background-color: var(--severe); }
        .fill.recovering { background-color: var(--recovering); }
        .fill.mostly-healed { background-color: var(--mostly-healed); }
        .fill.flash { animation: flash 0.25s steps(1) 4; }
        @keyframes flash {
            0% { opacity: 1; }
            50% { opacity: 0.15; }
        }
        .label {
            position: absolute;
            inset: 0;
            padding: 0 8px;
            line-height: var(--bar-height);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div id="overlay"></div>
    <script>
        const MAX_DAMAGE = 20;
        const PART_COUNT = 6;
        const HEALED = 11;
        const IDLE_MS = 3000;     // overlay fades this long after the last change
        const GONE_MS = 1500;     // fully healed: empty bar shown this long before its fade
        const FLASH_MS = 1000;    // healing bar flashes this long when a healing actor is hit
        const FADE_MS = 600;
        const NO_PARTS = Array.from({ length: PART_COUNT }, () => [0, HEALED]);

        const root = document.getElementById('overlay');
        const actors = new Map();  // id -> {bar, fill, label, name, parts, sum, lastHit, gone, flashUntil, flashTimer}
        let lastChange = 0;

        function damageStage(damage) {
            if (damage >= 11) return 'severe';
            if (damage >= 4) return 'medium';
            return 'light';
        }

        // Whole-body summary: {state: hurting|healing|healed, width %, cls, damage total}.
        function summarize(parts) {
            let damage = 0, damaged = 0, healing = 0, unhealed = 0;
            for (const [d, h] of parts) {
                if (d > 0) {
                    damage += Math.min(d, MAX_DAMAGE);
                    damaged++;
                } else if (h < HEALED) {
                    healing += Math.max(h, 0);
                    unhealed++;
                }
            }
            if (damaged) {
                return { state: 'hurting', width: damage / (MAX_DAMAGE * PART_COUNT) * 100,
                    cls: damageStage(damage / damaged), damage };
            }
            if (unhealed) {
                return { state: 'healing', width: healing / (HEALED * unhealed) * 100,
                    cls: healing / unhealed >= 4 ? 'mostly-healed' : 'recovering', damage: 0 };
            }
            return { state: 'healed', width: 0, cls: '', damage: 0 };
        }

        function paint(a, sum) {
            a.fill.className = 'fill ' + sum.cls;
            a.fill.style.width = sum.width + '%';
            if (sum.state !== 'healed') {
                a.label.textContent = `${a.name} (${sum.state})`;
            }
        }

        function create(id) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            const fill = document.createElement('div');
            fill.className = 'fill';
            const label = document.createElement('div');
            label.className = 'label';
            bar.appendChild(fill);
            bar.appendChild(label);
            root.appendChild(bar);
            const a = {
                bar, fill, label, name: '',
                parts: NO_PARTS, sum: summarize(NO_PARTS),
                lastHit: 0, gone: 0, flashUntil: 0, flashTimer: 0,
            };
            actors.set(id, a);
            return a;
        }

        // A healing actor (no damage, not yet healed) that took damage: flash the healing bar, then show the wound.
        function flashThenWound(a, prev) {
            paint(a, prev);
            a.fill.classList.add('flash');
            a.flashUntil = Date.now() + FLASH_MS;
            clearTimeout(a.flashTimer);
            a.flashTimer = setTimeout(() => {
                a.flashUntil = 0;
                paint(a, a.sum);
            }, FLASH_MS);
        }

        // Returns true when the actor's parts changed.
        function apply(a, parts, now) {
            if (JSON.stringify(parts) === JSON.stringify(a.parts)) return false;
            const prev = a.sum;
            const sum = summarize(parts);
            a.parts = parts.map((p) => [p[0], p[1]]);
            a.sum = sum;
            if (sum.damage > prev.damage) a.lastHit = now;
            if (prev.state === 'healing' && sum.state === 'hurting') {
                flashThenWound(a, prev);
            } else if (now >= a.flashUntil) {
                paint(a, sum);
            }
            return true;
        }

        // Fully healed (or dead / unloaded): empty bar, then fade and drop it.
        function retire(id, a, now) {
            if (a.gone) return;
            a.gone = now;
            setTimeout(() => {
                if (actors.get(id) !== a) return;
                a.bar.classList.add('fading');
                setTimeout(() => {
                    if (actors.get(id) !== a) return;
                    clearTimeout(a.flashTimer);
                    a.bar.remove();
                    actors.delete(id);
                }, FADE_MS);
            }, GONE_MS);
        }

        function whipUpdate(state) {
            const now = Date.now();
            const seen = new Set();
            for (const s of (state && state.actors) || []) {
                const id = String(s.id);
                seen.add(id);
                let a = actors.get(id);
                if (a && a.gone) {
                    // Back before its bar was dropped: start fresh.
                    clearTimeout(a.flashTimer);
                    a.bar.remove();
                    actors.delete(id);
                    a = null;
                }
                a = a || create(id);
                a.name = s.name || '';
                if (apply(a, s.parts || NO_PARTS, now)) lastChange = now;
                if (a.sum.state === 'healed') retire(id, a, now);
            }
            for (const [id, a] of actors) {
                if (seen.has(id) || a.gone) continue;
                if (apply(a, NO_PARTS, now)) lastChange = now;
                retire(id, a, now);
            }
            render();
        }

        function whipReset() {
            for (const a of actors.values()) {
                clearTimeout(a.flashTimer);
                a.bar.remove();
            }
            actors.clear();
            lastChange = 0;
            root.classList.remove('shown');
        }

        function render() {
            const order = [...actors.values()].sort((x, y) => y.lastHit - x.lastHit);
            // Most recent first; only touch the DOM when the order changed (moving a bar restarts its flash).
            if (order.some((a, i) => root.children[i] !== a.bar)) {
                for (const a of order) root.appendChild(a.bar);
            }
            root.classList.toggle('shown', actors.size > 0 && Date.now() - lastChange < IDLE_MS);
        }

        setInterval(render, 250);

        window.whipUpdate = whipUpdate;
        window.whipReset = whipReset;
    </script>
</body>
</html>
